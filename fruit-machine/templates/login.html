{% extends "base.html" %}
{% block title %}Log In - Fruit Machine{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Log In</h1>
    <form method="post">
        <label>Username
            <input type="text" name="username" required autofocus>
        </label>
        <label>Password
            <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn btn-gold">Log In</button>
    </form>
    <p class="auth-switch">No account yet? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
