{% extends "base.html" %}
{% block title %}Register - Fruit Machine{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Register</h1>
    <p class="hint">You'll start with 100 tokens.</p>
    <form method="post">
        <label>Username
            <input type="text" name="username" required autofocus>
        </label>
        <label>Password
            <input type="password" name="password" required minlength="4">
        </label>
        <button type="submit" class="btn btn-gold">Register &amp; Play</button>
    </form>
    <p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
